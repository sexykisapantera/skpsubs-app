<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Subscriptions</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: one phone column of rounded cards. Hero total, stat tiles, a heads-up banner, the renewal list,
   per-card tiles, settings rows. Adding and editing happen in a bottom sheet. Theme follows Telegram. */
:root {
  --bg: #f2f3f5;
  --card: #ffffff;
  --card-2: #f6f7f8;
  --line: #e6e8eb;
  --ink: #111214;
  --muted: #6c7077;
  --faint: #a3a7ad;
  --lime: #c4ef4a;
  --lime-ink: #10140a;
  --lime-text: #4f6b00;
  --lime-soft: #eef8cf;
  --lime-line: #c9e57a;
  --red: #d9443a;
  --shadow: 0 1px 2px rgba(16, 18, 20, 0.04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0e0f10;
  --card: #1a1b1d;
  --card-2: #222326;
  --line: #2a2c2f;
  --ink: #f3f4f5;
  --muted: #8d9198;
  --faint: #5d6167;
  --lime: #c4ef4a;
  --lime-ink: #10140a;
  --lime-text: #c4ef4a;
  --lime-soft: #1f2513;
  --lime-line: #3b4a17;
  --red: #ff6a5f;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

.wrap {
  max-width: 560px; margin: 0 auto; display: grid; gap: 12px;
  padding-top: calc(16px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  padding-bottom: calc(104px + var(--tg-safe-area-inset-bottom, 0px) + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 4px 2px 6px; }
.date { font-size: 13px; color: var(--muted); }
h1 { margin: 2px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
.sync.local::before { background: var(--faint); }

/* hero */
.hero { padding: 20px; display: grid; gap: 4px; }
.label { font-size: 13px; color: var(--muted); }
.big { font-size: 44px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.big small { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin-left: 4px; color: var(--muted); }
.hero .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hero .sub b { color: var(--lime-text); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tiles.two { grid-template-columns: 1fr 1fr; }
.tiles.two .tile:last-child { grid-column: 1 / -1; }
.tile { padding: 12px 12px 13px; display: grid; gap: 2px; min-width: 0; }
.tile .label { font-size: 12px; }
.tile .v { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lime); border-radius: inherit; }

/* heads-up */
.heads { display: flex; gap: 12px; align-items: center; padding: 13px 14px; background: var(--lime-soft); border: 1px solid var(--lime-line); border-radius: 18px; }
.heads .dot { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.heads p { margin: 0; font-size: 14px; line-height: 1.4; }

/* list */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 4px 0; }
.sec-head h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.sec-head span { font-size: 13px; color: var(--muted); }
.list { overflow: hidden; }
.item { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
.item:first-child { border-top: 0; }
.item:active { background: var(--card-2); }
.mono { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; font-weight: 650; font-size: 16px; color: var(--muted); }
.item.soon .mono { background: var(--lime); color: var(--lime-ink); }
.item .n { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--lime-soft); color: var(--lime-text); border: 1px solid var(--lime-line); white-space: nowrap; }
.item .m { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt .p { font-weight: 600; font-size: 15px; }
.amt .o { font-size: 12px; color: var(--muted); }
.add-row { width: 100%; padding: 14px; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; color: var(--lime-text); font-weight: 600; cursor: pointer; display: flex; flex-wrap: wrap; gap: 2px 12px; justify-content: space-between; white-space: nowrap; }
.add-row span { color: var(--muted); font-weight: 400; font-size: 13px; }

/* empty state */
.empty { padding: 28px 22px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty .plus { width: 56px; height: 56px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; font-size: 30px; font-weight: 500; border: 0; cursor: pointer; }
.empty h2 { margin: 6px 0 0; font-size: 20px; letter-spacing: -0.015em; }
.empty p { margin: 0; color: var(--muted); max-width: 32ch; font-size: 14px; }

/* by card */
.cards-row { display: flex; gap: 8px; overflow-x: auto; padding: 1px; scrollbar-width: none; }
.cards-row::-webkit-scrollbar { display: none; }
.ctile { flex: 0 0 auto; min-width: 150px; padding: 12px 14px; display: grid; gap: 2px; }
.ctile .c { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ctile .c::before { content: ""; width: 14px; height: 10px; border-radius: 2px; border: 1.5px solid currentColor; opacity: .7; }
.ctile .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.ctile .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* settings */
.rows { overflow: hidden; }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 13px 14px; border-top: 1px solid var(--line); min-height: 54px; }
.row > div:first-child { flex: 1 1 9em; min-width: 0; }
.row:first-child { border-top: 0; }
.row .t { font-weight: 550; }
.row .d { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; flex: none; white-space: nowrap; background: var(--card-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 550; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #34363a; }
.rate { display: flex; flex: none; white-space: nowrap; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.rate input { width: 4.6em; text-align: right; }

input { font: inherit; color: var(--ink); background: var(--card-2); border: 1px solid transparent; border-radius: 12px; padding: 11px 12px; min-width: 0; width: 100%; }
input:focus { outline: none; border-color: var(--lime-line); background: var(--card); }
input::placeholder { color: var(--faint); }
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 46px; line-height: 1.3; text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
input[type="date"]::-webkit-calendar-picker-indicator { opacity: .6; }
.date-wrap { position: relative; min-width: 0; }
.date-wrap .ph { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.sheet .field, .sheet-in { min-width: 0; max-width: 100%; }

/* FAB */
.fab { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(20px + var(--tg-safe-area-inset-bottom, 0px) + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--lime); color: var(--lime-ink); font-size: 30px; font-weight: 500; display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 5; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 20; animation: fade .18s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 24px 24px 0 0; max-height: 92vh; overflow-y: auto; overflow-x: hidden; animation: up .22s cubic-bezier(.2,.8,.2,1);
  padding: 8px max(18px, env(safe-area-inset-left, 0px)) calc(18px + var(--tg-safe-area-inset-bottom, 0px) + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 2px auto 4px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h3 { margin: 0; font-size: 19px; letter-spacing: -0.015em; }
.x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--card-2); color: var(--muted); font-size: 18px; cursor: pointer; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.err { margin: 0; color: var(--red); font-size: 13px; }
.widget-card { margin-top: 10px; padding: 14px; display: grid; gap: 10px; }
.widget-card .t { font-weight: 550; }
.widget-card .d { font-size: 12px; color: var(--muted); margin: 0; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.linkish { background: none; border: 0; padding: 4px 0; color: var(--lime-text); font-weight: 600; text-align: left; cursor: pointer; }
.linkish.muted { color: var(--muted); font-weight: 500; font-size: 13px; }
.script-box { width: 100%; font: 12px/1.4 var(--mono); color: var(--ink); background: var(--card-2); border: 0; border-radius: 12px; padding: 10px; resize: vertical; }
.primary:disabled { opacity: .55; }
.primary { width: 100%; border: 0; border-radius: 999px; padding: 15px; background: var(--lime); color: var(--lime-ink); font-weight: 650; font-size: 16px; cursor: pointer; }
.danger { width: 100%; border: 0; border-radius: 999px; padding: 13px; background: transparent; color: var(--red); font-weight: 600; cursor: pointer; }
.danger.armed { background: var(--red); color: #fff; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { animation: none; } }
@media (max-width: 360px) { .big { font-size: 38px; } .tile .v { font-size: 15px; } }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="sheet-root"></div>
<script>
(function () {
  var LS_KEY = 'subscription-ledger-local';
  var LANG_KEY = 'subscription-ledger-lang';

  // ---------- Telegram ----------
  var tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
  function applyTheme() {

  function tap() { try { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  // ---------- language ----------
  function ukPlural(n, one, few, many) {

    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;

    },
    uk: {

      synced: 'Синхронізовано', local: 'На цьому пристрої', syncing: 'Синхронізую…',
      perMonth: 'Ви платите на місяць', perMonthUsd: function (v) { return '≈ ' + v + ' на місяць'; },
      perYear: 'На рік', next7: '7 днів', active: 'Активні',
      next7sub: function (n) { return n ? n + ' ' + ukPlural(n, 'списання', 'списання', 'списань') : 'нічого'; },

      newSub: 'Нова підписка', editSub: 'Редагувати підписку',
      name: 'Назва', namePh: 'Netflix, Spotify, iCloud…', price: 'Ціна', billing: 'Оплата', monthly: 'Щомісяця', yearly: 'Щороку',
      nextRenewal: 'Наступне списання', pickDate: 'Оберіть дату', card: 'Картка', cardPh: 'Mono •• 4821 (необов’язково)',
      add: 'Додати підписку', save: 'Зберегти', del: 'Видалити підписку', delConfirm: 'Натисніть ще раз, щоб видалити', close: 'Закрити',
      errName: 'Вкажіть назву підписки.', errPrice: 'Вкажіть ціну числом, наприклад 199 або 9.99.', errDate: 'Оберіть дату наступного списання.',
      errCard: 'Вкажіть лише банк і останні 4 цифри, не повний номер картки.',
      everyMonth: 'щомісяця', everyYear: 'щороку'
    }
  };
  var tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.language_code || '' : '';
  var lang = '';
  try { lang = localStorage.getItem(LANG_KEY) || ''; } catch (e) {}
  if (!STRINGS[lang]) lang = /^(uk|ru)/i.test(tgLang || navigator.language || '') ? 'uk' : 'en';
  document.documentElement.lang = lang;
  function T(k) { return STRINGS[lang][k]; }
  function setLang(l) { lang = l; tap(); try { localStorage.setItem(LANG_KEY, l); } catch (e) {} document.documentElement.lang = l; render(); renderSheet(); scheduleServerSync(); }

  // ---------- state ----------
  var state = { v: 2, rate: 42, subs: [] };
  // The first public version shipped six example rows. Remove them from saved lists if the user never touched them.

  // ---------- bottom sheet: add / edit ----------

  function validate(d) {
    var name = String(d.name || '').trim();
    var price = parseFloat(String(d.price).replace(/\s/g, '').replace(',', '.'));
    if (!name) return 'errName';
    if (!isFinite(price) || price < 0) return 'errPrice';
    if (!parseDate(d.next)) return 'errDate';
    var card = String(d.card || '').trim().slice(0, 40);
    // Data is synced to Telegram and the reminder server, so a full card number must never be stored: label + last 4 digits only.
    if (/\d{5,}/.test(card.replace(/[\s\-–—._]/g, ''))) return 'errCard';
    return { name: name.slice(0, 80), price: Math.round(price * 100) / 100, currency: d.currency === 'USD' ? 'USD' : 'UAH', cycle: d.cycle === 'yearly' ? 'yearly' : 'monthly', next: d.next, card: card };
  }

  function submitSheet() {
    var v = validate(sheet.draft);

    if (sheet.id) { Object.assign(state.subs.find(function (z) { return z.id === sheet.id; }), v); }
    else { v.id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); state.subs.push(v); }

  // ---------- persistence ----------
  // Telegram CloudStorage keeps each user's list on Telegram's side, synced across their devices.
  // Values are capped at 4096 chars, so the JSON is split into chunks d0..dN with a "meta" key holding the count.
  var cs = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
  var CHUNK = 4000, saveTimer = null, savedChunks = 0;

  // The reminder server keeps a copy so the bot can message the day before a charge.
  // Telegram's signed initData proves to the server which user is sending it.
  var SYNC_URL = 'https://skpsubs-reminders.skpsubs.workers.dev';
  var serverTimer = null;
  function syncServer() {
    if (!tg || !tg.initData) return;
    try {
      fetch(SYNC_URL + '/sync', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData, lang: lang, rate: state.rate, subs: state.subs }) }).catch(function () {});
    } catch (e) {}
  }
  function scheduleServerSync() { clearTimeout(serverTimer); serverTimer = setTimeout(syncServer, 800); }

  function csGet(keys) { return new Promise(function (res, rej) { cs.getItems(keys, function (err, v) { err ? rej(err) : res(v || {}); }); }); }
  function csSet(k, v) { return new Promise(function (res, rej) { cs.setItem(k, v, function (err) { err ? rej(err) : res(); }); }); }
  function csDel(keys) { return new Promise(function (res) { if (!keys.length) return res(); cs.removeItems(keys, function () { res(); }); }); }

  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function loadLocal() { try { var v = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (v && Array.isArray(v.subs)) { state = v; return true; } } catch (e) {} return false; }

  function saveCloud() {
    var json = JSON.stringify(state), parts = [];
    for (var i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
    saving = true; render();
    var chain = Promise.resolve();
    parts.forEach(function (p, i) { chain = chain.then(function () { return csSet('d' + i, p); }); });
    return chain.then(function () { return csSet('meta', JSON.stringify({ n: parts.length, v: 2 })); })
      .then(function () { var stale = []; for (var j = parts.length; j < savedChunks; j++) stale.push('d' + j); savedChunks = parts.length; return csDel(stale); })
      .then(function () { saving = false; mode = 'shared'; render(); }, function () { saving = false; mode = 'local'; render(); });
  }

  function loadCloud() {
    return csGet(['meta']).then(function (m) {
      var meta = null; try { meta = JSON.parse(m.meta || 'null'); } catch (e) {}
      if (!meta || !(meta.n > 0)) return false;
      var keys = []; for (var i = 0; i < meta.n; i++) keys.push('d' + i);
      return csGet(keys).then(function (v) {
        var parsed = JSON.parse(keys.map(function (k) { return v[k] || ''; }).join(''));
        if (!parsed || !Array.isArray(parsed.subs)) return false;
        state = parsed; savedChunks = meta.n; return true;
      });
    });
  }

  function commit() {
    saveLocal(); render();
    if (cs) { clearTimeout(saveTimer); saveTimer = setTimeout(saveCloud, 400); }
    scheduleServerSync();
  }

  // ---------- boot ----------
  document.body.appendChild(h('button', { id: 'fab', class: 'fab', type: 'button', 'aria-label': T('addSub'), text: '+', hidden: true, onclick: function () { openSheet(null); } }));
  render();
  function afterLoad() {
    var before = JSON.stringify(state.subs);
    normalize();
    render();
    if (JSON.stringify(state.subs) !== before) commit(); // old examples were removed: save the cleaned list
    else scheduleServerSync();
    prepareWidget(false);
  }
  if (cs) {
    loadCloud().then(function (found) { if (!found) loadLocal(); mode = 'shared'; afterLoad(); },
                     function () { loadLocal(); mode = 'local'; afterLoad(); });
  } else { loadLocal(); mode = 'local'; afterLoad(); }
})();
</script>
</body>
</html>

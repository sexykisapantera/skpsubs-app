@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  // ---------- money: every price is shown in hryvnias and dollars ----------
  var fmtUAH = new Intl.NumberFormat('uk-UA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fmtUSD = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function uah(v) { return fmtUAH.format(v) + ' ₴'; }
  function usd(v) { return '$' + fmtUSD.format(v); }
  function fmt(v, cur) { return cur === 'USD' ? usd(v) : uah(v); }
  function toUAH(v, cur) { return cur === 'USD' ? v * state.rate : v; }
  function both(vUAH) { return { uah: uah(vUAH), usd: usd(vUAH / state.rate) }; }
  function monthlyUAH(s) { var v = toUAH(s.price, s.currency); return s.cycle === 'yearly' ? v / 12 : v; }
  function yearlyUAH(s) { var v = toUAH(s.price, s.currency); return s.cycle === 'yearly' ? v : v * 12; }

  // ---------- tiny DOM helper (all user text goes through textContent) ----------
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    (kids || []).forEach(function (c) { if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }

  // ---------- rendering ----------
  function sorted() {
    return state.subs.map(function (s) { return { s: s, d: nextRenewal(s) }; })
      .sort(function (a, b) {
        var ad = a.d ? a.d.getTime() : Infinity, bd = b.d ? b.d.getTime() : Infinity;
        return ad - bd || a.s.name.localeCompare(b.s.name);
      });
  }

  function totalCard(cls, label, vUAH, sub) {
    var b = both(vUAH);
    return h('div', { class: 'total' + (cls ? ' ' + cls : '') }, [
      h('span', { class: 'k', text: label }),
      h('span', { class: 'v', text: b.uah }),
      h('span', { class: 'v2', text: b.usd }),
      h('span', { class: 's', text: sub })
    ]);
  }

  function render() {
    var app = document.getElementById('app');
    var focusId = document.activeElement && document.activeElement.id;
    app.textContent = '';

    var list = sorted();
    var perMonth = state.subs.reduce(function (a, s) { return a + monthlyUAH(s); }, 0);
    var perYear = state.subs.reduce(function (a, s) { return a + yearlyUAH(s); }, 0);
    var soon = list.filter(function (x) { return x.d && daysUntil(x.d) <= 7; });
    var soonSum = soon.reduce(function (a, x) { return a + toUAH(x.s.price, x.s.currency); }, 0);
    var t = today();

    var saveText = saving ? T('saving') : mode === 'shared' ? T('savedPage') : mode === 'local' ? T('savedLocal') : '';
    var langSeg = h('div', { class: 'seg lang', role: 'group', 'aria-label': T('langAria') }, [['en', 'EN'], ['uk', 'УКР']].map(function (o) {
      return h('button', { type: 'button', id: 'lang-' + o[0], 'aria-pressed': String(lang === o[0]), text: o[1], onclick: function () { setLang(o[0]); } });
    }));
    var rateInput = h('input', { id: 'rate', inputmode: 'decimal', value: String(state.rate), 'aria-label': T('rateAria'), onchange: function (e) {
      var r = parseFloat(String(e.target.value).replace(',', '.'));
      if (isFinite(r) && r > 0) { state.rate = Math.round(r * 100) / 100; commit(); } else { e.target.value = String(state.rate); }
    } });

    app.appendChild(h('header', { class: 'top' }, [
      h('div', null, [
        h('div', { class: 'eyebrow', text: T('eyebrow') + ' · ' + t.toLocaleDateString('uk-UA') }),
        h('h1', { text: T('title') })
      ]),
      h('div', { class: 'side' }, [
        h('div', { class: 'side-row' }, [langSeg, h('label', { class: 'rate' }, ['1 $ =', rateInput, '₴'])]),
        h('span', { class: 'save-state', role: 'status', text: saveText })
      ])
    ]));

    app.appendChild(h('section', { class: 'totals', 'aria-label': 'Totals' }, [
      totalCard('', T('perMonth'), perMonth, T('subsCount')(state.subs.length)),
      totalCard('', T('perYear'), perYear, T('yearlyOnce')),
      totalCard('soon', T('next7'), soonSum, soon.length ? T('renewalsSoon')(soon.length) : T('nothingSoon'))
    ]));

    // Per-card totals: shown once at least one subscription names a card.
    var groups = {}, order = [];
    state.subs.forEach(function (s) {
      var key = s.card || '';
      if (!groups[key]) { groups[key] = { m: 0, n: 0 }; order.push(key); }
      groups[key].m += monthlyUAH(s); groups[key].n += 1;
    });
    if (order.some(function (k) { return k !== ''; })) {
      order.sort(function (a, b) { return (a === '') - (b === '') || groups[b].m - groups[a].m; });
      app.appendChild(h('section', { class: 'by-card', 'aria-label': T('byCard') }, [
        h('div', { class: 'ledger-head plain' }, [h('h2', { text: T('byCard') }), h('span', { text: T('byCardHint') })]),
        h('div', { class: 'card-tiles' }, order.map(function (k) {
          var g = groups[k], b = both(g.m);
          return h('div', { class: 'card-tile' + (k ? '' : ' none') }, [
            h('div', { class: 'card' + (k ? '' : ' none'), text: k || T('noCardGroup') }),
            h('div', { class: 'ct-v', text: b.uah + T('mo') }),
            h('div', { class: 'ct-s' }, [h('span', { class: 'ct-usd', text: b.usd + T('mo') }), h('span', { text: T('subsCount')(g.n) })]),
            h('div', { class: 'ct-y', text: uah(g.m * 12) + T('yr') })
          ]);
        }))
      ]));
    }

    var form = h('form', { class: 'add', 'aria-label': T('addAria'), onsubmit: function (e) {
      e.preventDefault();
      var v = validate(draft);
      if (typeof v === 'string') { formError = v; haptic('error'); render(); return; }
      v.id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      state.subs.push(v); haptic('success');
      draft = { name: '', price: '', currency: draft.currency, cycle: draft.cycle, next: '', card: draft.card }; formError = '';
      commit();
    } }, fieldSet(draft, 'add', true));
    app.appendChild(form);
    // Cards already used, offered as suggestions so the same card is spelled the same way each time.
    var cards = [];
    state.subs.forEach(function (s) { if (s.card && cards.indexOf(s.card) < 0) cards.push(s.card); });
    app.appendChild(h('datalist', { id: 'card-options' }, cards.map(function (c) { return h('option', { value: c }); })));
    if (formError) app.appendChild(h('p', { class: 'err', role: 'alert', text: T(formError) }));

    app.appendChild(h('div', { class: 'ledger-head' }, [h('h2', { text: T('upcoming') }), h('span', { text: T('within7') })]));
    var ul = h('ul', { class: 'ledger' });
    if (!list.length) ul.appendChild(h('li', { class: 'empty', text: T('empty') }));
    list.forEach(function (x) { ul.appendChild(x.s.id === editingId ? editRow(x.s) : row(x)); });
    app.appendChild(ul);

    if (tg) app.appendChild(h('p', { class: 'note', text: T('remindNote') }));
    if (state.examples) app.appendChild(h('p', { class: 'note', text: T('note') }));

    if (focusId) { var f = document.getElementById(focusId); if (f) f.focus(); }
  }

  function seg(d, key, options, prefix, label, extraClass) {
    return h('div', { class: 'seg' + (extraClass ? ' ' + extraClass : ''), role: 'group', 'aria-label': label }, options.map(function (o) {
      return h('button', { type: 'button', id: prefix + '-' + key + '-' + o[0], 'aria-pressed': String(d[key] === o[0]), text: o[1], onclick: function () { d[key] = o[0]; render(); } });
    }));
  }

  function fieldSet(d, prefix, withSubmit) {
    var kids = [
      h('label', { class: 'field f-name' }, [h('span', { text: T('name') }), h('input', { id: prefix + '-name', value: d.name, placeholder: T('namePh'), autocomplete: 'off', oninput: function (e) { d.name = e.target.value; } })]),
      h('label', { class: 'field' }, [h('span', { text: T('price') }), h('input', { id: prefix + '-price', value: d.price, inputmode: 'decimal', placeholder: d.currency === 'USD' ? '9.99' : '199', oninput: function (e) { d.price = e.target.value; } })]),
      h('div', { class: 'field' }, [h('span', { text: T('currency') }), seg(d, 'currency', [['UAH', '₴'], ['USD', '$']], prefix, T('currency'), 'cur')]),
      h('div', { class: 'field' }, [h('span', { text: T('billing') }), seg(d, 'cycle', [['monthly', T('monthly')], ['yearly', T('yearly')]], prefix, T('billing'))]),
      h('label', { class: 'field' }, [h('span', { text: T('nextRenewal') }), h('input', { id: prefix + '-next', type: 'date', lang: lang, value: d.next, oninput: function (e) { d.next = e.target.value; } })]),
      h('label', { class: 'field f-card' }, [h('span', { text: T('card') }), h('input', { id: prefix + '-card', value: d.card || '', list: 'card-options', maxlength: '40', placeholder: T('cardPh'), autocomplete: 'off', oninput: function (e) { d.card = e.target.value; } })])
    ];
    if (withSubmit) kids.push(h('button', { class: 'btn', type: 'submit', id: 'add-submit', disabled: saving, text: T('add') }));
    return kids;
  }

  // Returns the cleaned subscription, or a dictionary key naming the problem.
  function validate(d) {
    var name = String(d.name || '').trim();
    var price = parseFloat(String(d.price).replace(/\s/g, '').replace(',', '.'));
    if (!name) return 'errName';
    if (!isFinite(price) || price < 0) return 'errPrice';
    if (!parseDate(d.next)) return 'errDate';
    var card = String(d.card || '').trim().slice(0, 40);
    // The page stores its data inside itself, so a full card number must never land here: allow a label and the last 4 digits only.
    if (/\d{5,}/.test(card.replace(/[\s\-–—._]/g, ''))) return 'errCard';
    return { name: name.slice(0, 80), price: Math.round(price * 100) / 100, currency: d.currency === 'USD' ? 'USD' : 'UAH', cycle: d.cycle === 'yearly' ? 'yearly' : 'monthly', next: d.next, card: card };
  }

  function row(x) {
    var s = x.s, d = x.d, n = d ? daysUntil(d) : null, isSoon = n != null && n <= 7;
    var dueText = n == null ? T('noDate') : n === 0 ? T('today') : n === 1 ? T('tomorrow') : T('inDays')(n);
    var other = s.currency === 'USD' ? uah(s.price * state.rate) : usd(s.price / state.rate);
    var li = h('li', { class: 'row' + (isSoon ? ' soon' : '') });
    li.appendChild(h('div', { class: 'cal', 'aria-hidden': 'true' }, d ? [h('div', { class: 'm', text: T('months')[d.getMonth()] }), h('div', { class: 'd', text: String(d.getDate()) })] : [h('div', { class: 'd', text: '–' })]));
    li.appendChild(h('div', { class: 'who' }, [
      h('div', { class: 'n', text: s.name }),
      h('div', { class: 'meta' }, [
        h('span', { class: 'due', text: dueText }),
        d ? h('span', { text: d.toLocaleDateString(T('locale'), { weekday: 'short', day: 'numeric', month: 'short', year: d.getFullYear() !== today().getFullYear() ? 'numeric' : undefined }) }) : null,
        h('span', { class: 'chip', text: s.cycle === 'yearly' ? T('chipYearly') : T('chipMonthly') }),
        h('span', { class: 'card' + (s.card ? '' : ' none'), title: T('card'), text: s.card || T('noCard') })
      ])
    ]));
    li.appendChild(h('div', { class: 'price' }, [
      h('div', { class: 'p', text: fmt(s.price, s.currency) }),
      h('div', { class: 'eq', text: '≈ ' + other })
    ]));
    if (confirmId === s.id) {
      li.appendChild(h('div', { class: 'acts' }, [
        h('button', { class: 'btn danger', id: 'confirm-del-' + s.id, disabled: saving, text: T('del'), onclick: function () { state.subs = state.subs.filter(function (z) { return z.id !== s.id; }); confirmId = null; haptic('warning'); commit(); } }),
        h('button', { class: 'btn ghost', id: 'keep-' + s.id, text: T('keep'), onclick: function () { confirmId = null; render(); } })
      ]));
    } else {
      li.appendChild(h('div', { class: 'acts' }, [
        h('button', { class: 'icon', id: 'edit-' + s.id, 'aria-label': T('edit') + ' ' + s.name, text: T('edit'), onclick: function () { editingId = s.id; confirmId = null; render(); var f = document.getElementById('edit-name'); if (f) f.focus(); } }),
        h('button', { class: 'icon del', id: 'del-' + s.id, 'aria-label': T('del') + ' ' + s.name, text: T('del'), onclick: function () { confirmId = s.id; editingId = null; render(); } })
      ]));
    }
    return li;
  }

  function editRow(s) {
    if (!editDraft || editDraft.id !== s.id) editDraft = { id: s.id, name: s.name, price: String(s.price), currency: s.currency, cycle: s.cycle, next: s.next, card: s.card || '' };
    var err = editDraft.err ? h('p', { class: 'err', role: 'alert', style: 'margin:0', text: T(editDraft.err) }) : null;
    return h('li', { class: 'row editing' }, [
      h('form', { style: 'display:grid;gap:12px', onsubmit: function (e) {
        e.preventDefault();
        var v = validate(editDraft);
        if (typeof v === 'string') { editDraft.err = v; render(); return; }
        var target = state.subs.find(function (z) { return z.id === s.id; });
        Object.assign(target, v);
        editingId = null; editDraft = null;
        commit();
      } }, [
        h('div', { class: 'edit-grid' }, fieldSet(editDraft, 'edit', false)),
        err,
        h('div', { class: 'edit-actions' }, [
          h('button', { class: 'btn ghost', type: 'button', text: T('cancel'), onclick: function () { editingId = null; editDraft = null; render(); } }),
          h('button', { class: 'btn', type: 'submit', disabled: saving, text: T('save') })
        ])
      ])
    ]);
  }

  // ---------- persistence ----------
  // Telegram CloudStorage keeps each user's data on Telegram's side, synced across their devices.
  // Values are capped at 4096 chars, so the JSON is split into chunks d0..dN with a "meta" key holding the count.
  var cs = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
  var CHUNK = 4000, saveTimer = null, savedChunks = 0;

  // The reminder server keeps a copy of the list so the bot can message the day before a charge.
  // Telegram's signed initData proves to the server which user is sending it.
  var SYNC_URL = 'https://skpsubs-reminders.skpsubs.workers.dev';
  var serverTimer = null;
  function syncServer() {
    if (!tg || !tg.initData || SYNC_URL.indexOf('https://') !== 0) return;
    try {
      fetch(SYNC_URL + '/sync', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData, lang: lang, rate: state.rate, subs: state.subs })
      }).catch(function () {});
    } catch (e) {}
  }
  function scheduleServerSync() { clearTimeout(serverTimer); serverTimer = setTimeout(syncServer, 800); }

  function csGet(keys) { return new Promise(function (res, rej) { cs.getItems(keys, function (err, v) { err ? rej(err) : res(v || {}); }); }); }
  function csSet(k, v) { return new Promise(function (res, rej) { cs.setItem(k, v, function (err) { err ? rej(err) : res(); }); }); }
  function csDel(keys) { return new Promise(function (res) { if (!keys.length) return res(); cs.removeItems(keys, function () { res(); }); }); }

  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
  function loadLocal() { try { var v = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (v && Array.isArray(v.subs)) { state = v; normalize(); return true; } } catch (e) {} return false; }

  function saveCloud() {
    var json = JSON.stringify(state), parts = [];
    for (var i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
    saving = true; render();
    var chain = Promise.resolve();
    parts.forEach(function (p, i) { chain = chain.then(function () { return csSet('d' + i, p); }); });
    return chain.then(function () { return csSet('meta', JSON.stringify({ n: parts.length, v: 1 })); })
      .then(function () {
        var stale = []; for (var j = parts.length; j < savedChunks; j++) stale.push('d' + j);
        savedChunks = parts.length; return csDel(stale);
      })
      .then(function () { saving = false; mode = 'shared'; render(); },
            function () { saving = false; mode = 'local'; render(); });
  }

  function loadCloud() {
    return csGet(['meta']).then(function (m) {
      var meta = null; try { meta = JSON.parse(m.meta || 'null'); } catch (e) {}
      if (!meta || !(meta.n > 0)) return false;
      var keys = []; for (var i = 0; i < meta.n; i++) keys.push('d' + i);
      return csGet(keys).then(function (v) {
        var parsed = JSON.parse(keys.map(function (k) { return v[k] || ''; }).join(''));
        if (!parsed || !Array.isArray(parsed.subs)) return false;
        state = parsed; normalize(); savedChunks = meta.n; return true;
      });
    });
  }

  function commit() {
    state.examples = false; // once edited, the examples note has done its job
    saveLocal(); render();
    if (cs) { clearTimeout(saveTimer); saveTimer = setTimeout(saveCloud, 400); }
    scheduleServerSync();
  }

  render();
  if (cs) {
    loadCloud().then(function (found) {
      if (!found) loadLocal(); // first launch on this account: examples, or this device's local copy
      mode = 'shared'; render(); scheduleServerSync();
    }, function () { loadLocal(); mode = 'local'; render(); scheduleServerSync(); });
  } else {
    loadLocal(); mode = 'local'; render();
  }
})();
</script>
</body>
</html>
